[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fossil2skeleton"
version = "0.1.0"
description = "Reconstructed research prototype for synthetic 3D skeletal landmark completion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jared Edward Reser"}]
dependencies = ["numpy>=1.24", "torch>=2.1"]

[tool.setuptools]
packages = ["fossil2skeleton"]
